[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "planora"
version = "2.0.0"
description = "Planora: GenAI-powered and deterministic celebration planner"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0.0,<4.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "google-genai>=1.0.0",
    "gunicorn>=22.0.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["api*", "tests*"]

[tool.setuptools.package-data]
app = ["prompts/*", "templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "RUF",
]
ignore = [
    "RUF012",
    "E501",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
