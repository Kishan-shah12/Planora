[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "planora"
version = "2.0.0"
description = "Planora: GenAI-powered and deterministic celebration planner"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0.0,<4.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "google-genai>=1.0.0",
    "gunicorn>=22.0.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["api*", "tests*"]

[tool.setuptools.package-data]
app = ["prompts/*", "templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
